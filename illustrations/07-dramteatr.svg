    <line x1="56.5" y1="80" x2="56.5" y2="169" stroke="#E2D8C6" stroke-width="2.5"/>
    <rect x="68" y="78" width="9" height="93" fill="#FFF8EC"/>
    <line x1="74.5" y1="80" x2="74.5" y2="169" stroke="#E2D8C6" stroke-width="2.5"/>
    <rect x="86" y="78" width="9" height="93" fill="#FFF8EC"/>
    <line x1="92.5" y1="80" x2="92.5" y2="169" stroke="#E2D8C6" stroke-width="2.5"/>
