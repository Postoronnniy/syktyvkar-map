    <polygon points="113,73 125,66 125,71 113,78" fill="#D9C6A0"/>
    <polygon points="11,60 116,60 128,53 23,53" fill="#FFF8EC"/>
    <rect x="11" y="60" width="105" height="13" fill="#FFF8EC"/>
